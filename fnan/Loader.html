<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Loading...</title></head>
<body>
<script>
  // Redirect to index.html sitting in the same folder as this file.
  // Works whether this file is opened directly, or base64-encoded into a
  // data: URI and opened that way — as long as it's placed at the root of
  // the game folder (next to index.html, assets/, js/, etc.) before encoding,
  // OR opened directly from disk in that folder (not as a data: URI, since
  // a data: URI has no folder to resolve "index.html" against).
  window.location.href = "index.html";
</script>
</body>
</html>
